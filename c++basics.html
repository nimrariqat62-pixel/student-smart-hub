<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Programming Fundamentals - Student Smart Hub</title>
    <style>
        body {
            background-color: #0b0712;
            color: #e2d9f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #c77dff;
            border-bottom: 2px solid #7b2cbf;
            padding-bottom: 10px;
        }

        /* Topics Index Box */
        .topics-index-card {
            background: #150d2a;
            border: 1px solid #7b2cbf;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.3);
        }

        .topics-index-card h3 {
            color: #e0aaff;
            margin-top: 0;
        }

        .topics-list {
            list-style: none;
            padding-left: 0;
        }

        .topics-list li {
            margin: 10px 0;
        }

        .topics-list a {
            color: #c77dff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .topics-list a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #c77dff;
        }

        /* Post-Mortem Card Style */
