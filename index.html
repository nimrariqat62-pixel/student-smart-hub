<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT SMART HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: UPPERCASE;
        }

        body {
            background-color: #0b0719;
            color: #ffffff;
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* TOP NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: #120824;
            border-bottom: 2px solid #a855f7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 900;
            color: #f3e8ff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 800;
        }

        .nav-links a:hover {
            color: #c084fc;
        }

        /* ANIME ROOM HERO SECTION */
        .hero-banner {
            position: relative;
            width: 100%;
            min-height: 500px;
            background: linear-gradient(135deg, #0d0624 0%, #170d38 50%, #29114d 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 60px;
            overflow: hidden;
            border-bottom: 3px solid #3b1d7d;
        }

        .stars-bg {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#fff 1px, transparent 1px), radial-gradient(#c084fc 1.5px, transparent 1.5px);
            background-size: 40px 40px, 80px 80px;
            animation: twinkle 10s linear infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 100px 200px, -200px 100px; }
        }

        .moon-art {
            position: absolute;
            top: 40px;
            right: 42%;
            width: 90px;
            height: 90px;
            background: #fef08a;
            border-radius: 50%;
            box-shadow: 0 0 50px #fde047, 0 0 100px rgba(253, 224, 71, 0.4);
            animation: moonGlow 4s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% { transform: scale(1); box-shadow: 0 0 40px #fde047; }
            100% { transform: scale(1.05); box-shadow: 0 0 70px #fef08a; }
        }

        .hero-left {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 0 0 20px #a855f7;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .visitor-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.25);
            border: 2px solid #a855f7;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 900;
            color: #f3e8ff;
        }

        .hero-right {
            position: relative;
            z-index: 2;
            padding: 30px;
            border-left: 4px solid #a855f7;
            background: rgba(15, 8, 30, 0.6);
        }

        .hero-right h3 {
            color: #c084fc;
            font-size: 1.3rem;
            font-weight: 900;
        }

        /* LONG CONTINUOUS MAIN CONTAINER (NO CARDS) */
        .main-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-header {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 40px;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px solid #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .content-block {
            margin-bottom: 30px;
        }

        .content-block strong {
            display: block;
            font-size: 1.25rem;
            font-weight: 900;
            color: #c084fc;
            margin-bottom: 8px;

            padding: 6px 12px;
            border-left: 4px solid #a855
