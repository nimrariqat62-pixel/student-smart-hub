<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Night Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #2b1055, #120626 65%, #080212);
            color: #f3e8ff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Moon */
        .moon {
            position: fixed;
            top: 45px;
            right: 50px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fffdf5, #e9d5ff);
            box-shadow: 0 0 40px #c084fc, 0 0 80px rgba(192, 132, 252, 0.45);
            animation: floatMoon 5s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatMoon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* Twinkling Stars */
        .star {
            position: fixed;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #e9d5ff;
            animation: twinkle var(--duration) ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Top-Left Corner 2 Arrows */
        .corner-arrows {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .corner-arrows button {
            background: rgba(88, 28, 135, 0.7);
            backdrop-filter: blur(8px);
            color: #f3e8ff;
            border: 1px solid #c084fc;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: 0.2s;
        }
        .corner-arrows button:hover {
            background: #9333ea;
            transform: scale(1.08);
        }

        /* Hidden Dropdown Menu (Line by Line) */
        .side-menu {
            position: fixed;
            top: 72px;
            left: 20px;
            width: 280px;
            display: none; /* Shuru mein bilkul band rahega */
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .side-menu.active {
            display: flex;
        }
        .menu-item {
            background: rgba(30, 13, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-left: 4px solid #c084fc;
            border-radius: 10px;
            border-top: 1px solid rgba(216, 180, 254, 0.2);
            border-right: 1px solid rgba(216, 180, 254, 0.2);
            border-bottom: 1px solid rgba(216, 180, 254, 0.2);
            font-size: 14px;
            color: #f3e8ff;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            animation: popIn 0.3s ease forwards;
            transition: 0.2s;
        }
        .menu-item:hover {
            background: rgba(126, 34, 206, 0.75);
            transform: translateX(6px);
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Empty Night Sky with Moon & Stars -->
    <div class="moon"></div>
    <div id="starsContainer"></div>

    <!-- Corner 2 Arrows -->
    <div class="corner-arrows">
        <button onclick="toggleWorkMenu(true)" title="Open Work Menu">▶</button>
        <button onclick="toggleWorkMenu(false)" title="Close Work Menu">◀</button>
    </div>

    <!-- Line-by-Line Work Menu (Opens on Click) -->
    <div id="workMenu" class="side-menu">
        <div class="menu-item" onclick="window.location.href='index.html'">
            🌙 <strong>Module 1:</strong> Korean Quiz & Vocab
        </div>
        <div class="menu-item" onclick="alert('Module 2: C++ Long Questions jald jor denge!')">
            ✨ <strong>Module 2:</strong> C++ Exam Questions
        </div>
        <div class="menu-item" onclick="alert('Module 3: DSA Arrays & Sliding Window!')">
            🚀 <strong>Module 3:</strong> DSA Portfolio
        </div>
        <div class="menu-item" onclick="alert('Module 4: South Korea Scholarship Roadmap!')">
            🎓 <strong>Module 4:</strong> Seoul Roadmap
        </div>
    </div>

    <script>
        // Twinkling Stars Generator
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 55; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // Open / Close Corner Menu
        function toggleWorkMenu(isOpen) {
            const menu = document.getElementById('workMenu');
            if (isOpen) {
                menu.classList.add('active');
            } else {
                menu.classList.remove('active');
            }
        }
    </script>

</body>
</html>
